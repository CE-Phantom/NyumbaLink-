<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Create your NyumbaLink account as a landlord or tenant.">

    <title>Create Account | NyumbaLink</title>

    <link rel="stylesheet" href="register.css">

</head>

<body>

    <main class="register-page">

        <!-- BRAND -->

        <a href="index.html" class="brand">

            <img
                src="logo.png"
                alt="NyumbaLink Logo">

            <span>NyumbaLink</span>

        </a>


        <!-- REGISTRATION -->

        <section class="register-container">

            <div class="register-heading">

                <span class="register-label">
                    GET STARTED
                </span>

                <h1>
                    Create your account
                </h1>

                <p>
                    Choose how you want to use NyumbaLink.
                </p>

            </div>


            <!-- ROLE SELECTION -->

            <div class="role-grid">


                <!-- LANDLORD -->

                <button
                    type="button"
                    class="role-card"
                    data-role="landlord">

                    <div class="role-icon">
                        🏢
                    </div>

                    <div class="role-content">

                        <h2>
                            I'm a Landlord
                        </h2>

                        <p>
                            Manage your properties, units,
                            tenants, rent and maintenance.
                        </p>

                    </div>

                    <span class="role-arrow">
                        →
                    </span>

                </button>


                <!-- TENANT -->

                <button
                    type="button"
                    class="role-card"
                    data-role="tenant">

                    <div class="role-icon">
                        🏠
                    </div>

                    <div class="role-content">

                        <h2>
                            I'm a Tenant
                        </h2>

                        <p>
                            Find a home, manage your rent,
                            payments and maintenance requests.
                        </p>

                    </div>

                    <span class="role-arrow">
                        →
                    </span>

                </button>

            </div>


            <!-- LOGIN -->

            <p class="login-text">

                Already have an account?

                <a href="login.html">
                    Sign in
                </a>

            </p>

        </section>


        <!-- FOOTER -->

        <p class="register-footer">

            © 2026 NyumbaLink. All rights reserved.

        </p>

    </main>


    <script src="register.js"></script>

</body>

</html>
